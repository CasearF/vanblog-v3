name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: docker.io
  IMAGE_NAME: casearxx/vanblog-v3

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Login to GitHub Container Registry
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            # ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # 先把镜像构建并加载到本机 docker（不推送），供冒烟测试使用。
      # PR 与 main 都走这一步；构建缓存写入 GHA，后面的推送步骤命中缓存秒级完成。
      - name: Build image (load for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: vanblog:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VAN_BLOG_BUILD_SERVER=http://localhost:3000
            VAN_BLOG_VERSIONS=${{ github.sha }}

      # 冒烟测试：起 mongo + vanblog 容器，断言关键端点（路由/格式回归防线）。
      # 失败则整个 job 失败，不会推送坏镜像。
      - name: Smoke test
        run: |
          docker network create vanblog-net
          docker run -d --name mongo --network vanblog-net mongo:4.4.16
          # 等 mongo 就绪再起 vanblog（server 启动时 initJwt 直连 mongo）
          for i in $(seq 1 30); do
            docker exec mongo mongo --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name vanblog --network vanblog-net -p 8080:80 \
            -e EMAIL=smoke@test.local -e HOSTNAME=0.0.0.0 -e PORT=3001 \
            vanblog:smoke
          bash scripts/ci-smoke-test.sh http://127.0.0.1:8080

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== vanblog logs ====="
          docker logs vanblog 2>&1 | tail -200 || true
          echo "===== mongo logs ====="
          docker logs mongo 2>&1 | tail -50 || true

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VAN_BLOG_BUILD_SERVER=http://localhost:3000
            VAN_BLOG_VERSIONS=${{ github.sha }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/artifact/**
          generate_release_notes: true
